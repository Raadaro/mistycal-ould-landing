name: Actualizar stock

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Generar stock.json desde Sheets
        run: |
          python scripts/update_stock_from_sheets.py
      
      - name: Guardar cambios
        run: |
          git config user.email "bot@mistycal.com.ar"
          git config user.name "Mistycal Bot"
          git add stock.json
          git diff --staged --quiet || git commit -m "stock actualizado $(date)"
          git push

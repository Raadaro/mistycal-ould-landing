<script>
(async function(){
  const CATALOGO = {
    "YARA-CANDY-G5": { nombre: "YARA CANDY G5", precio: "$44.899", nota: "Lattafa · 100ML" },
    "9PM-POUR-FEMME-G5": { nombre: "9PM POUR FEMME G5", precio: "$44.899", nota: "Afnan · 100ML" },
    "HOMME-WHITE-G5": { nombre: "HOMME WHITE G5", precio: "$62.360", nota: "Milestone · 100ML" },
    "CLUB-DE-NUIT-WOMAN-G5": { nombre: "CLUB DE NUIT WOMAN G5", precio: "$44.899", nota: "Armaf · 100ML" },
    "VALAYA-G5": { nombre: "VALAYA G5", precio: "$44.899", nota: "Paris Corner · 100ML" },
    "ASAD-G5": { nombre: "ASAD G5", precio: "$62.360", nota: "Lattafa · 100ML" }
  };
  try {
    const res = await fetch('./stock.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('no stock.json');
    const stock = await res.json();

    document.querySelectorAll('[data-card]').forEach(card => {
      const titular = card.getAttribute('data-titular');
      const suplente = card.getAttribute('data-suplente');
      const nameEl = card.querySelector('[data-name]');
      const priceEl = card.querySelector('[data-price]');
      const btn = card.querySelector('[data-btn]');
      const badge = card.querySelector('[data-badge]');
      const replBadge = card.querySelector('[data-repl-badge]');

      const titularHay = stock[titular] !== false;
      let idMostrar = titular;
      let esReemplazo = false;

      if(!titularHay){
        idMostrar = suplente;
        esReemplazo = true;
      }

      const hayStockFinal = stock[idMostrar] !== false;
      const data = CATALOGO[idMostrar];

      if(data){
        if(nameEl) nameEl.textContent = data.nombre;
        if(priceEl) priceEl.textContent = data.precio;
      }

      if(esReemplazo && hayStockFinal){
        replBadge?.classList.remove('hidden');
      } else {
        replBadge?.classList.add('hidden');
      }

      if(!hayStockFinal){
        card.style.opacity = '0.55';
        badge?.classList.remove('hidden');
        if(btn){ btn.textContent = 'No disponible'; btn.disabled = true; btn.className = 'mt-3 w-full h-[44px] rounded-full bg-[#E9E9E6] text-[#9A9A96] text-[12px] font-semibold tracking-[0.14em] uppercase cursor-not-allowed'; }
      } else {
        card.style.opacity = '1';
        badge?.classList.add('hidden');
        if(btn){ btn.textContent = 'Reservar'; btn.disabled = false; btn.className = 'mt-3 w-full h-[44px] rounded-full bg-[#111] text-white text-[12px] font-semibold tracking-[0.14em] uppercase hover:bg-black'; }
      }
    });
  } catch(e){
    console.warn('[MISTYCAL] No se pudo leer stock.json, se muestran titulares', e);
  }
})();

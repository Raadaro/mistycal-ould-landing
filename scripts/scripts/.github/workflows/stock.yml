name: Actualizar stock

on:
  schedule:
    - cron: '*/10 * * * *'     # cada 10 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:            # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: stock
  cancel-in-progress: true

jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Revisar stock en Pedix
        run: node scripts/check-stock.js
      - name: Guardar cambios
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add stock.json
          git diff --staged --quiet || (git commit -m "Actualizar stock" && git push)
